<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Handyman Painting L.L.C.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/gridstack@9.0.0/dist/gridstack.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@9.0.0/dist/gridstack-all.js"></script>
    <style>
      body { margin: 0; overflow-x: hidden; background-color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .grid-stack-item-content {
        background: #ffffff; border: 1px solid #e2e8f0; border-radius: 1rem;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
        display: flex; flex-direction: column; overflow: hidden;
      }
      .widget-header {
        cursor: move; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
        padding: 0.65rem 0.9rem; display: flex; justify-between: space-between; align-items: center;
      }
      .tier-emblem-large { width: 104px; height: 104px; object-fit: contain; }
      .slide-item { display: none; transition: opacity 0.5s ease-in-out; }
      .slide-item.active { display: block; }
    </style>
</head>
<body class="p-6 min-h-screen text-slate-800">

    <div id="top-bar-container" class="bg-white border border-slate-200 text-slate-900 p-3.5 rounded-2xl mb-6 flex justify-between items-center shadow-sm max-w-7xl mx-auto">
      <div class="flex items-center gap-4">
        <span class="text-sm font-black tracking-wider uppercase text-slate-900 border-r border-slate-200 pr-4">Handyman Painting L.L.C.</span>
        <span id="welcome-greeting-text" class="text-xs font-bold text-slate-600">Welcome Back!</span>
      </div>
      <div class="flex items-center gap-3">
        <button type="button" onclick="openBlockCatalog()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs px-3.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>+</span> Customize / Add Blocks
        </button>
        <button type="button" onclick="saveLayout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-lg border border-slate-300 font-medium transition">💾 Save Layout</button>
        <button type="button" onclick="if(window.grid) grid.compact()" class="text-xs text-slate-500 hover:text-slate-800 underline">Auto-Arrange</button>
        <button type="button" onclick="handleLogout()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold px-3 py-1.5 rounded-lg transition ml-2">Logout</button>
      </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <div class="grid-stack mb-6"></div>
    </div>

    <!-- Block Catalog Modal -->
    <div id="block-catalog-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-4 border border-slate-200">
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h3 class="font-bold text-slate-900 text-lg">Dashboard Block Catalog</h3>
            <p class="text-xs text-slate-500">Toggle tools on or off to personalize your workspace view.</p>
          </div>
          <button type="button" onclick="closeBlockCatalog()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
        </div>
        <div class="grid grid-cols-2 gap-3 max-h-96 overflow-y-auto p-1" id="catalog-items-container"></div>
        <div class="flex justify-end border-t pt-3">
          <button type="button" onclick="closeBlockCatalog()" class="px-5 py-2 text-xs font-bold text-white bg-slate-900 rounded-lg hover:bg-slate-800">Done</button>
        </div>
      </div>
    </div>

    <!-- Estimate Request Modal -->
    <div id="build-estimate-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-4 border border-slate-200 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b pb-3">
          <div>
            <h3 class="font-bold text-slate-900 text-lg">📝 Request a Project Estimate</h3>
            <p class="text-xs text-slate-500">Tell us about your project goals. Our team will review your specifications and provide a detailed quote.</p>
          </div>
          <button type="button" onclick="closeEstimateBuilderModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
        </div>
        <form id="build-estimate-form" onsubmit="submitFullEstimate(event)" class="space-y-4 text-xs">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="font-bold text-slate-700 block mb-1">Project Name *</label>
              <input type="text" id="builder-title" required placeholder="e.g. Master Bedroom Refresh" class="w-full border rounded-lg p-2.5 font-medium border-slate-300">
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Project Category *</label>
              <select id="builder-type" class="w-full border rounded-lg p-2.5 font-medium border-slate-300 bg-white">
                <option value="Interior Painting">Interior Painting</option>
                <option value="Exterior Painting">Exterior Painting</option>
                <option value="Cabinet Refinishing">Cabinet Refinishing</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="font-bold text-slate-700 block mb-1">Preferred Color Swatch</label>
              <input type="text" id="builder-color" placeholder="e.g. Naval - SW 6244" class="w-full border rounded-lg p-2.5 font-medium border-slate-300">
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Est. Sq Footage</label>
              <input type="number" id="builder-sqft" placeholder="e.g. 500" class="w-full border rounded-lg p-2.5 font-medium border-slate-300">
            </div>
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">Additional Notes</label>
            <textarea id="builder-notes" rows="2" class="w-full border rounded-lg p-2.5 font-medium border-slate-300" placeholder="Room details or scope notes..."></textarea>
          </div>
          <div class="flex justify-end gap-2 border-t pt-3">
            <button type="button" onclick="closeEstimateBuilderModal()" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg">Cancel</button>
            <button type="submit" class="px-5 py-2 text-xs font-bold text-white bg-slate-900 rounded-lg">Submit Estimate Request</button>
          </div>
        </form>
      </div>
    </div>

    <script>
        window.CURRENT_CUSTOMER_ID = 1;
        window.CUSTOMER_DATA = { profile: {}, spend: 0.00, tier: 'Standard', projects: [], invoices: [] };
        window.SELECTED_SWATCH = { title: 'Naval - SW 6244', hex: '#1d2b3a' };

        const SWATCH_DATA = {
            sherwin: [
                { name: 'Naval', code: 'SW 6244', hex: '#1d2b3a' },
                { name: 'Alabaster', code: 'SW 7008', hex: '#f0efe6' },
                { name: 'Repose Gray', code: 'SW 7015', hex: '#ccc7bf' },
                { name: 'Tricorn Black', code: 'SW 6258', hex: '#2c2c2c' }
            ],
            benjamin: [
                { name: 'Hale Navy', code: 'HC-154', hex: '#24323d' },
                { name: 'Chantilly Lace', code: 'OC-65', hex: '#f7f9f6' },
                { name: 'Revere Pewter', code: 'HC-172', hex: '#ccc5b9' },
                { name: 'Kendall Charcoal', code: 'HC-166', hex: '#53565a' }
            ]
        };

        const BLOCK_CONFIGS = {
            builder:  { id: 'builder',  title: '📝 Estimate Request Assistant', file: '/components/builder-block.html',  w: 6,  h: 4 },
            tier:     { id: 'tier',     title: '🏆 Tier & Loyalty Status',      file: '/components/tier-block.html',     w: 12, h: 3 },
            projects: { id: 'projects', title: '📁 Projects & Requests',        file: '/components/projects-block.html', w: 6,  h: 4 },
            invoices: { id: 'invoices', title: '💳 Invoices & Financials',      file: '/components/invoices-block.html', w: 6,  h: 4 },
            showcase: { id: 'showcase', title: '✨ Premium Showcase & Ideas',   file: '/components/showcase-block.html', w: 12, h: 4 },
            mixer:    { id: 'mixer',    title: '🎨 Interactive Paint Studio',   file: '/components/mixer-block.html',    w: 6,  h: 5 },
            settings: { id: 'settings', title: '⚙️ Profile & Account Details', file: '/components/settings-block.html', w: 6,  h: 4 }
        };

        const componentCache = {};
        let activeBlocks = new Set();
        let grid;

        async function fetchComponentHTML(id) {
            if (componentCache[id]) return componentCache[id];
            const config = BLOCK_CONFIGS[id];
            if (!config) return '';
            try {
                const res = await fetch(config.file);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const html = await res.text();
                componentCache[id] = html;
                return html;
            } catch (err) {
                console.error(`Failed to load component: ${config.file}`, err);
                return `<div class="p-4 text-xs text-rose-500 font-bold">Failed to load ${config.title} component file.</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            grid = GridStack.init({ cellHeight: 80, margin: 12, handle: '.widget-header', resizable: { handles: 'se, sw' } });
            await loadCustomerDataAndLayout();
        });

        async function loadCustomerDataAndLayout() {
            let activeLayout = ['builder', 'tier', 'projects', 'invoices', 'showcase', 'mixer', 'settings'];
            try {
                const response = await fetch(`/api/customer/dashboard-data/${window.CURRENT_CUSTOMER_ID}`);
                if (response.ok) {
                    const data = await response.json();
                    window.CUSTOMER_DATA = data;
                    if (data.layout && data.layout.length > 0) activeLayout = data.layout;
                    if (data.profile?.name) {
                        document.getElementById('welcome-greeting-text').innerText = `Welcome Back, ${data.profile.name}!`;
                    }
                }
            } catch (err) {
                console.warn('Backend server unavailable. Loaded local fallback state.');
            }

            for (const id of activeLayout) {
                await addBlock(id, false);
            }
            renderProjectsList();
        }

        async function addBlock(id, refresh = false) {
            const config = BLOCK_CONFIGS[id];
            if (!config || !grid || activeBlocks.has(id)) return;
            const contentHtml = await fetchComponentHTML(id);
            grid.addWidget({ w: config.w, h: config.h, content: contentHtml });
            activeBlocks.add(id);
            if (id === 'mixer') renderSwatches('sherwin');
            if (id === 'projects') renderProjectsList();
            if (refresh) openBlockCatalog();
        }

        function removeBlock(id, refresh = false) {
            const el = document.querySelector(`[data-block-id="${id}"]`)?.closest('.grid-stack-item');
            if (el) {
                grid.removeWidget(el);
                activeBlocks.delete(id);
                if (refresh) openBlockCatalog();
            }
        }

        function renderSwatches(brand) {
            const gridEl = document.getElementById('paint-swatches-grid');
            if (!gridEl) return;
            
            const btnSherwin = document.getElementById('tab-sherwin');
            const btnBenjamin = document.getElementById('tab-benjamin');
            
            if (brand === 'sherwin') {
                btnSherwin.className = 'px-2.5 py-1 text-[11px] font-bold rounded-lg border bg-slate-900 text-white border-slate-900';
                btnBenjamin.className = 'px-2.5 py-1 text-[11px] font-bold rounded-lg border bg-slate-100 text-slate-700 hover:bg-slate-200';
            } else {
                btnBenjamin.className = 'px-2.5 py-1 text-[11px] font-bold rounded-lg border bg-slate-900 text-white border-slate-900';
                btnSherwin.className = 'px-2.5 py-1 text-[11px] font-bold rounded-lg border bg-slate-100 text-slate-700 hover:bg-slate-200';
            }

            const items = SWATCH_DATA[brand] || [];
            gridEl.innerHTML = items.map(s => `
                <div onclick="selectSwatch('${s.name} - ${s.code}', '${s.hex}')" class="p-2 border rounded-xl cursor-pointer hover:border-slate-800 transition flex items-center gap-2 bg-white">
                    <div class="w-6 h-6 rounded-full border border-slate-300 shadow-inner flex-shrink-0" style="background-color: ${s.hex}"></div>
                    <div class="truncate">
                        <p class="font-bold text-[11px] text-slate-800 truncate">${s.name}</p>
                        <p class="text-[9px] text-slate-400 uppercase">${s.code}</p>
                    </div>
                </div>
            `).join('');
        }

        function selectSwatch(title, hex) {
            window.SELECTED_SWATCH = { title, hex };
            const wall = document.getElementById('visualizer-wall');
            const hexLabel = document.getElementById('wall-hex-label');
            const titleLabel = document.getElementById('action-color-title');
            
            if (wall) wall.style.backgroundColor = hex;
            if (hexLabel) hexLabel.innerText = hex.toUpperCase();
            if (titleLabel) titleLabel.innerText = title;
        }

        function saveColorToEstimate() {
            const colorInput = document.getElementById('builder-color');
            if (colorInput) colorInput.value = window.SELECTED_SWATCH.title;
            openNewEstimateBuilderModal();
        }

        function renderProjectsList() {
            const container = document.getElementById('project-list-container');
            const heading = document.getElementById('projects-count-heading');
            if (!container) return;

            const projects = window.CUSTOMER_DATA.projects || [];
            if (heading) heading.innerText = `Projects (${projects.length})`;

            if (projects.length === 0) {
                container.innerHTML = `<p class="text-slate-500 italic p-4 text-center">No active projects found.</p>`;
                return;
            }

            container.innerHTML = projects.map(p => `
                <div class="p-3 border border-slate-200 bg-slate-50 rounded-xl flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-800">${p.title}</p>
                        <p class="text-[10px] text-slate-500">${p.type} • <span class="font-semibold text-slate-700">${p.color}</span></p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-200">${p.status}</span>
                </div>
            `).join('');
        }

        async function submitFullEstimate(e) {
            e.preventDefault();
            const payload = {
                customerId: window.CURRENT_CUSTOMER_ID,
                title: document.getElementById('builder-title').value,
                type: document.getElementById('builder-type').value,
                color: document.getElementById('builder-color').value,
                sqft: document.getElementById('builder-sqft').value,
                notes: document.getElementById('builder-notes').value
            };

            try {
                const res = await fetch('/api/customer/estimates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const data = await res.json();
                    window.CUSTOMER_DATA.projects.unshift(data.project);
                    renderProjectsList();
                    alert('Estimate request submitted successfully!');
                }
            } catch (err) {
                alert('Saved locally (Offline Mode).');
            }
            closeEstimateBuilderModal();
        }

        async function saveLayout() {
            const currentLayout = Array.from(activeBlocks);
            try {
                const res = await fetch(`/api/customer/layout/${window.CURRENT_CUSTOMER_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ layout: currentLayout })
                });
                if (res.ok) alert('Dashboard layout saved to your profile!');
            } catch (err) {
                alert('Layout saved locally!');
            }
        }

        function openBlockCatalog() {
            const container = document.getElementById('catalog-items-container');
            if (!container) return;
            container.innerHTML = Object.values(BLOCK_CONFIGS).map(block => {
                const isActive = activeBlocks.has(block.id);
                return `
                <div class="p-3 border rounded-lg flex flex-col justify-between space-y-2 ${isActive ? 'bg-slate-50 border-slate-200' : 'bg-white border-slate-300'}">
                    <div>
                        <p class="font-bold text-xs text-slate-800">${block.title}</p>
                        <p class="text-[10px] text-slate-500">${isActive ? 'Active on Dashboard' : 'Available'}</p>
                    </div>
                    <button type="button" onclick="toggleBlockFromCatalog('${block.id}', ${isActive})" class="text-xs px-2.5 py-1 rounded font-bold ${isActive ? 'bg-rose-100 text-rose-700 hover:bg-rose-200' : 'bg-slate-900 text-white hover:bg-slate-800'}">
                      ${isActive ? 'Remove Block' : '+ Add Block'}
                    </button>
                </div>`;
            }).join('');
            document.getElementById('block-catalog-modal').classList.remove('hidden');
        }

        function toggleBlockFromCatalog(id, isActive) { isActive ? removeBlock(id, true) : addBlock(id, true); }
        function closeBlockCatalog() { document.getElementById('block-catalog-modal').classList.add('hidden'); }
        function openNewEstimateBuilderModal() { document.getElementById('build-estimate-modal').classList.remove('hidden'); }
        function closeEstimateBuilderModal() { document.getElementById('build-estimate-modal').classList.add('hidden'); }
        function handleLogout() { localStorage.clear(); window.location.href = '/login.html'; }
    </script>
</body>
</html>
