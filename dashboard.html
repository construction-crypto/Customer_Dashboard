<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal | Handyman Painting L.L.C.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack-all.js"></script>
  <style>
    .grid-stack-item-content { background: #ffffff; border-radius: 0.5rem; border: 1px solid #e2e8f0; overflow: hidden; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-slate-900 text-white border-b border-slate-800 px-6 py-2 flex items-center justify-between sticky top-0 z-30 shadow-xs">
    <div class="flex items-center gap-3">
      <img src="./logo.jpg" alt="Handyman Painting L.L.C. Logo" class="h-9 w-auto rounded border border-slate-700 bg-black p-0.5" />
      <h1 class="font-semibold text-sm text-slate-100 flex items-center gap-2">
        Handyman Painting L.L.C.
        <span id="nav-tier-badge" class="text-[10px] font-medium bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded uppercase">Standard Tier</span>
      </h1>
    </div>

    <div class="flex items-center gap-3">
      <div class="text-right border-r border-slate-800 pr-3 hidden sm:block">
        <div id="nav-user-email" class="text-xs font-medium text-slate-200">Loading...</div>
        <div id="nav-user-role" class="text-[10px] text-slate-400 capitalize">Client Account</div>
      </div>
      <button type="button" onclick="handleLogout()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs rounded border border-slate-700 transition">Log Out</button>
    </div>
  </header>

  <main class="p-6 flex-1 bg-slate-100/60">
    <div id="dashboard-grid" class="grid-stack min-h-[85vh]"></div>
  </main>

  <!-- PayPal Checkout Modal -->
  <div id="paypal-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg border border-slate-200 max-w-md w-full p-6 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-semibold text-slate-900 text-sm">Pay Outstanding Invoice</h3>
        <button type="button" onclick="closePaypalModal()" class="text-slate-400 hover:text-slate-600 font-medium text-sm">✕</button>
      </div>
      <p class="text-xs text-slate-600">Complete your payment securely via PayPal or Credit Card.</p>
      <div id="paypal-button-container"></div>
    </div>
  </div>

  <script>
    let grid = null;
    let selectedInvoiceId = null;

    // Dynamic API base URL: defaults to production backend on external domains
    const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:4000'
      : 'https://api.construction.seemoneyproductions.com';

    async function initPayPalSDK() {
      try {
        const res = await fetch(${API_BASE_URL}/api/config/paypal);
        const { clientId } = await res.json();

        if (!clientId) {
          console.error('PayPal Client ID missing from backend configuration.');
          return;
        }

        const script = document.createElement('script');
        script.src = https://www.paypal.com/sdk/js?client-id=&currency=USD;
        script.onload = () => console.log('PayPal SDK loaded dynamically and securely.');
        document.head.appendChild(script);
      } catch (err) {
        console.error('Error fetching PayPal public client ID:', err);
      }
    }

    window.PortalEngine = {
      state: null,

      async fetchAuthSession() {
        const token = localStorage.getItem('userToken');
        if (!token) {
          window.location.href = 'login.html';
          return;
        }

        try {
          const res = await fetch(${API_BASE_URL}/api/dashboard-data, {
            headers: { 'Authorization': Bearer  }
          });

          if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
              window.location.href = 'login.html';
              return;
            }
            throw new Error('Failed loading portal state');
          }

          const data = await res.json();
          this.state = data;
          this.bindDataToDOM();
        } catch (err) {
          console.error('Production Data Sync Error:', err);
        }
      },

      bindDataToDOM() {
        if (!this.state || !this.state.customer) return;
        const c = this.state.customer;
        const navEmail = document.getElementById('nav-user-email');
        if (navEmail) navEmail.innerText = c.email;
        const navBadge = document.getElementById('nav-tier-badge');
        if (navBadge) navBadge.innerText = ${c.tier || 'Standard'} Tier;
      },

      initiatePayment(invoiceId) {
        selectedInvoiceId = invoiceId;
        const modal = document.getElementById('paypal-modal');
        if (modal) modal.classList.remove('hidden');
        renderPaypalButtons();
      }
    };

    function renderPaypalButtons() {
      const container = document.getElementById('paypal-button-container');
      container.innerHTML = '';
      if (typeof paypal === 'undefined') return;

      paypal.Buttons({
        createOrder: async () => {
          const token = localStorage.getItem('userToken');
          const res = await fetch(${API_BASE_URL}/api/paypal/create-order, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': Bearer 
            },
            body: JSON.stringify({ invoiceId: selectedInvoiceId })
          });
          const data = await res.json();
          return data.orderID;
        },
        onApprove: async (data) => {
          const token = localStorage.getItem('userToken');
          const res = await fetch(${API_BASE_URL}/api/paypal/capture-order, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': Bearer 
            },
            body: JSON.stringify({ orderID: data.orderID, invoiceId: selectedInvoiceId })
          });
          const result = await res.json();
          if (result.status === 'SUCCESS') {
            alert('Payment received! Invoice updated.');
            closePaypalModal();
            window.PortalEngine.fetchAuthSession();
          }
        }
      }).render('#paypal-button-container');
    }

    function closePaypalModal() {
      const modal = document.getElementById('paypal-modal');
      if (modal) modal.classList.add('hidden');
    }

    function handleLogout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      grid = GridStack.init({ column: 12, cellHeight: 85, margin: 10, float: true });
      initPayPalSDK();
      window.PortalEngine.fetchAuthSession();
    });
  </script>
</body>
</html>
