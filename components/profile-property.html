<div class="p-5 bg-white text-slate-800 space-y-5 h-full">
  <div class="flex items-center justify-between border-b border-slate-100 pb-3">
    <div>
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Property & Site Details</h3>
      <p id="property-address" class="text-sm font-semibold text-slate-800">--</p>
    </div>
    <span id="property-type-tag" class="px-2 py-0.5 bg-slate-100 text-slate-600 text-[10px] font-medium rounded">--</span>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="p-3 bg-slate-50 border border-slate-200/60 rounded">
      <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Access Protocol / Code</span>
      <span id="property-access-code" class="text-xs font-mono font-bold text-slate-700 mt-1 block">--</span>
    </div>
    <div class="p-3 bg-slate-50 border border-slate-200/60 rounded">
      <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">On-Site Constraints</span>
      <span id="property-site-notes" class="text-xs font-medium text-slate-700 mt-1 block">--</span>
    </div>
    <div class="p-3 bg-slate-50 border border-slate-200/60 rounded">
      <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Authorized Service Hours</span>
      <span id="property-service-hours" class="text-xs font-medium text-slate-700 mt-1 block">--</span>
    </div>
  </div>

  <div class="space-y-2">
    <label for="property-instructions-input" class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Site Access & Contractor Instructions</label>
    <textarea id="property-instructions-input" onchange="window.PortalEngine.updateSiteInstructions(this.value)" rows="2" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded text-slate-700 focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
  </div>
</div>
