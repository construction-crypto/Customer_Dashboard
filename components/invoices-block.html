<div class="p-4 bg-white text-slate-800 space-y-3 h-full">
  <div class="flex items-center justify-between border-b border-slate-100 pb-2">
    <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Financial Overview</h3>
    <button type="button" onclick="window.PortalEngine.viewStatementHistory()" class="text-[11px] text-indigo-600 hover:text-indigo-700 font-medium">History →</button>
  </div>

  <div class="grid grid-cols-2 gap-2">
    <div class="p-2.5 bg-slate-50 border border-slate-200/60 rounded">
      <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider block">Outstanding Balance</span>
      <span id="financial-outstanding" class="text-base font-semibold text-slate-900 mt-0.5 block">--</span>
    </div>
    <div class="p-2.5 bg-slate-50 border border-slate-200/60 rounded">
      <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider block">Paid Year-to-Date</span>
      <span id="financial-ytd" class="text-base font-semibold text-slate-900 mt-0.5 block">--</span>
    </div>
  </div>

  <button id="pay-balance-btn" type="button" onclick="window.PortalEngine.initiatePayment()" class="w-full py-1.5 bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs rounded transition shadow-xs">
    Pay Outstanding Balance
  </button>
</div>
