<div class="bg-brand-black text-white p-6 rounded-lg shadow border-l-4 border-brand-red flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
        <div class="flex items-center space-x-2">
            <span class="inline-block w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
            <span class="text-xs font-semibold text-emerald-400 tracking-wider uppercase">Account Active & In Sync</span>
            <span class="text-zinc-500 text-xs">|</span>
            <span id="header-current-date" class="text-xs text-zinc-400 font-medium"></span>
        </div>
        <h1 class="text-3xl font-black mt-1 uppercase tracking-tight" id="welcome-header">
            Welcome, Customer
        </h1>
        <p class="text-zinc-400 text-sm mt-1">
            Manage your project schedule, paint color preferences, material estimates, and invoices.
        </p>
    </div>
    
    <div class="flex items-center space-x-3 w-full md:w-auto">
        <button onclick="openQuickBidModal()" class="w-full md:w-auto bg-brand-red hover:bg-red-700 text-white font-bold py-2.5 px-5 rounded text-xs transition uppercase tracking-wider flex items-center justify-center space-x-2 shadow-lg">
            <span>+ Request New Bid</span>
        </button>
    </div>
</div>

<!-- Quick Bid Request Modal -->
<div id="quick-bid-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white text-slate-900 rounded-lg max-w-md w-full p-6 shadow-2xl relative border-t-4 border-brand-red">
        <button onclick="closeQuickBidModal()" class="absolute top-3 right-3 text-zinc-400 hover:text-zinc-700 text-xl font-bold">&times;</button>
        <h3 class="font-black text-xl uppercase tracking-wide mb-1">Request Project Bid</h3>
        <p class="text-xs text-zinc-500 mb-4">Submit quick details and Jesse will schedule a site visit.</p>
        
        <form id="quick-bid-form" onsubmit="handleQuickBidSubmit(event)" class="space-y-3 text-xs">
            <div>
                <label class="block font-bold mb-1">Project Scope</label>
                <select id="qb-scope" class="w-full border p-2 rounded bg-zinc-50 font-medium" required>
                    <option value="">Select scope...</option>
                    <option value="Interior Painting">Interior Painting</option>
                    <option value="Exterior Painting">Exterior Painting</option>
                    <option value="Cabinet Refinishing">Cabinet Refinishing</option>
                    <option value="Deck / Fence Staining">Deck / Fence Staining</option>
                    <option value="Commercial Painting">Commercial Painting</option>
                </select>
            </div>
            <div>
                <label class="block font-bold mb-1">Property Address</label>
                <input type="text" id="qb-address" value="1012 North 6th Street, Montevideo, MN" class="w-full border p-2 rounded bg-zinc-50" required>
            </div>
            <div>
                <label class="block font-bold mb-1">Project Details / Notes</label>
                <textarea id="qb-notes" rows="3" placeholder="Number of rooms, target completion dates, or specific repair needs..." class="w-full border p-2 rounded bg-zinc-50"></textarea>
            </div>
            <div class="pt-2 flex justify-end space-x-2">
                <button type="button" onclick="closeQuickBidModal()" class="px-4 py-2 border rounded font-bold uppercase text-[11px] hover:bg-zinc-100">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-brand-red hover:bg-red-700 text-white font-bold rounded uppercase text-[11px]">Submit Request</button>
            </div>
        </form>
    </div>
</div>

<script>
    (function initHeaderGreeting() {
        // Set dynamic time-based greeting
        const now = new Date();
        const hours = now.getHours();
        let greeting = "Good Morning";
        if (hours >= 12 && hours < 17) greeting = "Good Afternoon";
        else if (hours >= 17) greeting = "Good Evening";

        // Display current date
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        const dateEl = document.getElementById("header-current-date");
        if (dateEl) dateEl.innerText = now.toLocaleDateString('en-US', dateOptions);

        // Update greeting text with user name if available
        const user = typeof getUserClaims === "function" ? getUserClaims() : { name: "Customer" };
        const welcomeEl = document.getElementById("welcome-header");
        if (welcomeEl) welcomeEl.innerText = `${greeting}, ${user.name}`;
    })();

    function openQuickBidModal() {
        document.getElementById("quick-bid-modal").classList.remove("hidden");
    }

    function closeQuickBidModal() {
        document.getElementById("quick-bid-modal").classList.add("hidden");
    }

    function handleQuickBidSubmit(e) {
        e.preventDefault();
        const scope = document.getElementById("qb-scope").value;
        const address = document.getElementById("qb-address").value;
        const notes = document.getElementById("qb-notes").value;

        // Store request in localStorage
        const bids = JSON.parse(localStorage.getItem("customer_bids") || "[]");
        bids.unshift({
            id: "BID-" + Math.floor(1000 + Math.random() * 9000),
            scope: scope,
            address: address,
            notes: notes,
            date: new Date().toLocaleDateString(),
            status: "Pending Site Review"
        });
        localStorage.setItem("customer_bids", JSON.stringify(bids));

        alert("✅ Bid request submitted! Jesse will contact you shortly.");
        closeQuickBidModal();

        // Broadcast event so Project Bids component updates dynamically
        window.dispatchEvent(new CustomEvent("bidsUpdated"));
    }
</script>
