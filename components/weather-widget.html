<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handyman Field Weather Widget</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f9; color: #333; padding: 2rem; }
        .weather-card { background: #fff; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .error { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <div class="weather-card">
        <h3>Job Site Weather</h3>
        <div id="weather-output">Loading local conditions...</div>
    </div>

    <script>
        async function loadWeather() {
            const output = document.getElementById('weather-output');
            try {
                const lat = 45.31;
                const lon = -95.89;
                
                const response = await fetch(https://api.open-meteo.com/v1/forecast?latitude=&longitude=&current=temperature_2m,weather_code);
                if (!response.ok) throw new Error(HTTP error! status: );
                
                const data = await response.json();
                const tempC = data.current.temperature_2m;
                const tempF = (tempC * 9/5) + 32;
                
                output.innerHTML = 
                    <p><strong>Temperature:</strong> °F (°C)</p>
                    <p><strong>Conditions:</strong> Normal Operations Clear</p>
                ;
            } catch (err) {
                output.innerHTML = <span class="error">Failed to load weather data: </span>;
            }
        }
        loadWeather();
    </script>
</body>
</html>
