<div class="grid-stack-item-content" data-block-id="builder">
  <div class="widget-header">
    <span class="font-bold text-xs text-slate-800">📝 Estimate Request Assistant</span>
    <button type="button" onclick="removeBlock('builder', false)" class="text-slate-400 hover:text-slate-600 text-sm font-bold">&times;</button>
  </div>
  <div class="p-4 text-xs space-y-3 overflow-y-auto flex flex-col justify-between h-full">
    <p class="text-slate-600">Combine paint swatches, trim options, and room dimensions to request a fast quote from our team.</p>
    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1">
      <div class="flex justify-between items-center"><span class="font-bold text-slate-700">Active Requests:</span><span id="builder-active-count" class="font-black text-slate-900">0</span></div>
      <p class="text-[11px] text-slate-500">Provide details on your vision, and we'll take care of the rest.</p>
    </div>
    <button type="button" onclick="openNewEstimateBuilderModal()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl transition shadow-sm">
      + Start New Estimate Request
    </button>
  </div>
</div>
